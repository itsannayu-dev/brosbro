<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Most Likely Bros</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one column. Roster guys are trading cards, the prompt is one big pink block. Boldness lives in those two; everything else stays quiet. */
:root{
  --bg:#E4F3F1; --surface:#FFFFFF; --ink:#06302D; --muted:#46696A; --line:#BFDCD8; --edge:#06302D;
  --pink:#0A7A72; --on-pink:#FFFFFF; --gold:#FFC857; --on-gold:#241800;
  --t0:#14B8A6; --t1:#38BDF8; --t2:#34D399; --t3:#0E9AA7; --t4:#FFC857; --t5:#6EE7B7;
  --face:#F4DFCB; --nope:#D1432F;
  --display:'Bowlby One',Impact,'Arial Black',sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#041F1E; --surface:#0C2C2A; --ink:#E6FBF8; --muted:#8DB9B4; --line:#164440; --edge:#4DB3A9;
    --pink:#2DD4BF; --on-pink:#02201C; --nope:#FF7A66; --gold:#FFC857; --on-gold:#241800;
    --t0:#2DD4BF; --t1:#5CC8FF; --t2:#4ADE9B; --t3:#22B8C7; --t4:#FFC857; --t5:#86EFC0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#041F1E; --surface:#0C2C2A; --ink:#E6FBF8; --muted:#8DB9B4; --line:#164440; --edge:#4DB3A9;
  --pink:#2DD4BF; --on-pink:#02201C; --nope:#FF7A66; --gold:#FFC857; --on-gold:#241800;
  --t0:#2DD4BF; --t1:#5CC8FF; --t2:#4ADE9B; --t3:#22B8C7; --t4:#FFC857; --t5:#86EFC0;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font:400 16px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:22px 64px;
}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3,p{margin:0}
h1{font:400 clamp(36px,10vw,60px)/.92 var(--display);text-transform:uppercase;text-wrap:balance;margin-top:10px}
h1 span{color:var(--pink);display:block}
h2{font:400 22px/1.1 var(--display);text-wrap:balance}
.eyebrow,.mono,label,.k,.tag,.num,.was,.badge{font-family:var(--mono)}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500}
.lede{color:var(--muted);margin-top:14px;max-width:52ch}
.nav{display:flex;border-bottom:2px solid var(--edge);margin:24px 0 24px}
.nav button{flex:1;min-height:46px;background:none;border:0;border-bottom:4px solid transparent;margin-bottom:-2px;color:var(--muted);font:600 15px var(--body);cursor:pointer;padding:0 4px}
.nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--pink)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.center{text-align:center}
.center .actions{justify-content:center}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hint{color:var(--muted);margin-top:8px;max-width:62ch}
.sect{margin-top:30px}
.sect>h2{margin-bottom:14px}
.tag{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;background:var(--gold);color:var(--on-gold);padding:4px 8px;border-radius:4px}
label{display:block;font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--edge);border-radius:8px;padding:10px 12px;min-height:44px}
textarea{resize:vertical}
.btn{min-height:46px;padding:0 18px;border:2px solid var(--edge);background:var(--surface);color:var(--ink);font:700 15px var(--body);border-radius:8px;box-shadow:3px 3px 0 var(--edge);cursor:pointer}
.btn:active:not([disabled]){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--edge)}
.btn.primary{background:var(--pink);color:var(--on-pink)}
.btn.small{min-height:40px;padding:0 12px;font-size:13px;box-shadow:2px 2px 0 var(--edge)}
.btn.ghost{background:none;border-color:transparent;box-shadow:none;text-decoration:underline;color:var(--muted)}
.btn[disabled]{opacity:.45;box-shadow:none;cursor:not-allowed}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:18px}
.actions.tight{margin-top:14px;gap:10px}
.notice{color:var(--pink);font-weight:600;margin-top:12px}

/* roster cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.guy{background:var(--surface);border:2px solid var(--edge);border-radius:12px;box-shadow:4px 4px 0 var(--edge);overflow:hidden;min-width:0}
.guy-top{background:color-mix(in srgb,var(--t) 38%,var(--surface));display:flex;justify-content:space-between;align-items:flex-end;padding:12px 14px 0}
.avatar{width:150px;height:150px}
.pimg{display:block;width:100%;height:100%;object-fit:cover;border-radius:12px;border:2px solid var(--edge);background:var(--surface)}
.avatar svg,.face svg{display:block;width:100%;height:100%}
.who{display:flex;flex-direction:column;align-items:flex-end;gap:2px;padding-bottom:10px}
.num{font-size:22px;font-weight:500}
.was{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);opacity:.75}
.guy-body{padding:2px 14px 16px}

/* prompts list */
details.pl{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
details.pl summary{cursor:pointer;font-weight:700;min-height:36px;display:flex;align-items:center}
.plist{list-style:none;margin:10px 0 0;padding:0}
.plist li{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:4px 0}
.plist label{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:40px;margin:0;font:500 15px var(--body);letter-spacing:0;text-transform:none;color:var(--ink)}
.plist input[type=checkbox]{width:20px;height:20px;accent-color:var(--pink);flex:none}
.plist .pre{color:var(--muted)}
.addrow{display:flex;gap:10px;margin-top:14px}
.addrow input{flex:1;min-width:0}
.check{display:flex;align-items:center;gap:10px;margin-top:14px;min-height:40px;font:500 15px var(--body);letter-spacing:0;text-transform:none;color:var(--ink)}
.check input{width:20px;height:20px;accent-color:var(--pink)}

/* play */
.rh{display:flex;justify-content:space-between;gap:10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--pink);transition:width .3s}
.prompt{background:var(--pink);color:var(--on-pink);border:2px solid var(--edge);border-radius:12px;box-shadow:5px 5px 0 var(--edge);padding:22px 20px 26px;margin:20px 0 22px}
.prompt.alt{background:var(--ink);color:var(--bg)}
.prompt .k{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.prompt h2{font:400 clamp(28px,7.6vw,46px)/1.02 var(--display);margin-top:10px;text-wrap:balance}
.prompt.alt h2{font-size:clamp(22px,6vw,32px);line-height:1.15}
.instr{margin-bottom:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.tile{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--surface);color:var(--ink);border:2px solid var(--edge);border-radius:10px;padding:0;overflow:hidden;font:inherit;min-width:0}
button.tile{cursor:pointer;box-shadow:3px 3px 0 var(--edge)}
button.tile.sel{outline:4px solid var(--pink);outline-offset:2px;transform:translate(-1px,-1px)}
.tile.win{outline:4px solid var(--gold);outline-offset:2px}
.tile .face{display:flex;justify-content:center;align-items:flex-end;height:96px;background:color-mix(in srgb,var(--t) 38%,var(--surface))}
.tile .face svg{width:72px;height:72px}
.tile .face.ph{display:block;height:auto}
.tile .face .pimg{width:100%;height:auto;aspect-ratio:1;border:0;border-radius:0;border-bottom:2px solid var(--edge)}
.tile .info{display:flex;flex-direction:column;gap:2px;padding:9px 10px 11px}
.tile .nm{font-weight:700;font-size:16px;line-height:1.2}
.tile .tt{font-size:12px;line-height:1.25;color:var(--muted)}
.tile .votes{padding:0 10px 11px;font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.badges{position:absolute;top:6px;left:6px;display:flex;gap:4px;flex-wrap:wrap;z-index:1}
.badge{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;padding:3px 6px;border-radius:4px;background:var(--pink);color:var(--on-pink)}
.badge.gold{background:var(--gold);color:var(--on-gold)}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:8px}
.stepper button{width:40px;height:40px;border:2px solid var(--edge);background:var(--surface);color:var(--ink);border-radius:8px;font:700 22px/1 var(--body);cursor:pointer;padding:0}
.stepper output{font:400 26px var(--display);min-width:28px;text-align:center}
.verdict{border:2px solid var(--edge);border-radius:10px;padding:14px 16px;margin:20px 0 4px;background:var(--surface)}
.verdict.hit{background:color-mix(in srgb,var(--t5) 30%,var(--surface))}
.verdict.miss{background:color-mix(in srgb,var(--gold) 38%,var(--surface))}
.verdict h3{font:400 20px/1.15 var(--display);margin-bottom:8px;text-wrap:balance}

/* results */
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--gold) 40%,var(--surface));border:2px solid var(--edge);border-radius:12px;box-shadow:5px 5px 0 var(--edge);padding:16px 18px}
.hero-av{display:flex}
.hero-av span{width:130px;height:130px;display:block;margin-right:-18px}
.hero-av svg{width:100%;height:100%;display:block}
.hero-av .pimg{border-radius:50%}
.hero .k{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
.hero h2{font-size:clamp(24px,6.5vw,34px);margin:6px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat .big{font:400 34px/1 var(--display);display:block}
.stat .big small{font:500 14px var(--body);color:var(--muted)}
.stat .lab{display:block;color:var(--muted);margin-top:6px;font-size:14px}
.standings{margin-top:8px}
.srow{display:grid;grid-template-columns:26px 64px minmax(0,1fr) 30px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.srow .rk{font:500 13px var(--mono);color:var(--muted)}
.srow .mini{width:64px;height:64px;background:color-mix(in srgb,var(--t) 38%,var(--surface));border-radius:8px;overflow:hidden;display:flex;align-items:flex-end}
.srow .mini svg{width:100%;height:100%;display:block}
.srow .mini .pimg{border:0;border-radius:0}
.srow .nm{font-weight:700;line-height:1.2}
.srow .nm small{font-weight:400;color:var(--muted)}
.srow .bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:6px}
.srow .bar i{display:block;height:100%;width:var(--w);background:var(--t);transition:width .4s}
.srow .ct{font:400 20px var(--display);text-align:right}
#copybox{margin-top:14px;min-height:120px;font:400 14px/1.4 var(--mono)}

/* swipe deck */
.deckmeta{display:flex;justify-content:space-between;font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);width:min(100%,340px);margin:0 auto 10px}
.deck{position:relative;width:min(100%,340px);margin:0 auto}
.swipe-card{background:var(--surface);border:2px solid var(--edge);border-radius:16px;box-shadow:5px 5px 0 var(--edge);overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;will-change:transform;position:relative}
.swipe-card.back{position:absolute;inset:0;transform:scale(.94) translateY(14px);pointer-events:none;opacity:.9}
.swipe-card:active{cursor:grabbing}
.art{background:color-mix(in srgb,var(--t) 38%,var(--surface));aspect-ratio:1/1;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.art svg{width:78%;height:auto;display:block}
.art .pimg{width:100%;height:100%;border:0;border-radius:0;pointer-events:none;-webkit-user-drag:none}
.cap{padding:12px 16px 16px;display:flex;flex-direction:column;gap:2px}
.cap .nm{font:400 26px/1.05 var(--display)}
.cap .tt{color:var(--muted);font-size:15px}
.stamp{position:absolute;top:22px;opacity:0;font:400 28px var(--display);text-transform:uppercase;padding:2px 12px;border:4px solid;border-radius:8px;background:color-mix(in srgb,var(--surface) 80%,transparent);pointer-events:none}
.stamp.yes{left:18px;color:var(--pink);transform:rotate(-14deg)}
.stamp.no{right:18px;color:var(--nope);transform:rotate(14deg)}
.swrow{display:flex;justify-content:center;gap:28px;margin-top:20px}
.round{width:68px;height:68px;border-radius:50%;border:2px solid var(--edge);background:var(--surface);box-shadow:3px 3px 0 var(--edge);font:700 28px/1 var(--body);cursor:pointer;padding:0}
.round:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--edge)}
.round.no{color:var(--nope)}
.round.yes{color:var(--pink)}
.swhint{text-align:center;color:var(--muted);font-size:14px;margin-top:14px}
.swrow{gap:12px;align-items:center}
.round{width:56px;height:56px;font-size:34px;color:var(--ink);flex:none;padding-bottom:4px}
.pickbtn{flex:1;max-width:220px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;width:max-content;max-width:100%;margin:0 auto 18px;border:2px solid var(--edge);border-radius:8px;overflow:hidden}
.seg button{min-height:40px;padding:0 22px;background:var(--surface);color:var(--ink);border:0;font:600 14px var(--body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pink);color:var(--on-pink)}
.linkbox{font:500 13px var(--mono);word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;user-select:all}
.tile .votes.live{padding:0;margin-top:6px;color:var(--muted)}
.glist{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.grow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;grid-template-areas:"n q p" "n q b";gap:6px 12px;align-items:center;background:var(--surface);border:2px solid var(--edge);border-radius:12px;padding:10px 12px;box-shadow:3px 3px 0 var(--edge)}
.grow .gn{grid-area:n;font:500 13px var(--mono);color:var(--muted)}
.grow .gq{grid-area:q;display:flex;flex-direction:column;gap:2px;min-width:0}
.grow .gq .k{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.grow .gq strong{font-size:16px;line-height:1.25;text-wrap:balance}
.grow .gp{grid-area:p;display:flex;flex-direction:column;align-items:center;gap:4px;width:84px}
.grow .gimg{display:block;width:72px;height:72px;border-radius:10px;overflow:hidden;background:color-mix(in srgb,var(--t) 38%,var(--surface));border:2px solid var(--edge)}
.grow .gimg .pimg{border:0;border-radius:0}
.grow .gimg svg{width:100%;height:100%;display:block}
.grow .gnm{font-weight:700;font-size:14px;text-align:center;line-height:1.15}
.grow .btn{grid-area:b;justify-self:center;min-height:34px;padding:0 10px;font-size:12px}
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px;margin-top:20px}
.flip{perspective:900px;background:none;border:0;padding:0;cursor:pointer;text-align:left;font:inherit;color:inherit;min-width:0;display:block}
.fi{display:grid;transition:transform .6s;transform-style:preserve-3d}
.flip.on .fi{transform:rotateY(180deg)}
.ff,.fb{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--edge);border-radius:12px;box-shadow:4px 4px 0 var(--edge);overflow:hidden;background:var(--surface);display:flex;flex-direction:column;min-width:0}
.fb{transform:rotateY(180deg);background:color-mix(in srgb,var(--t) 38%,var(--surface));align-items:center;justify-content:center;padding:10px;gap:8px;text-align:center}
.fb .art{width:100%;height:auto;aspect-ratio:1;border-radius:12px;border:2px solid var(--edge);flex:none}
.fb .art .pimg{border:0;border-radius:0}
.fb .real{font:400 22px/1.05 var(--display);overflow-wrap:anywhere}
.fb .was2{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);opacity:.75}
.ff .cap .nm{font-size:20px}
@media (prefers-reduced-motion: reduce){.fi{transition:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Bachelorette game</p>
    <h1>Most likely to <span>Bro edition</span></h1>
    <p class="lede">Every guest becomes a guy. The bride picks who fits each prompt, the room votes, and a miss costs a sip.</p>
  </header>
  <nav id="nav" class="nav" aria-label="Game sections"></nav>
  <main id="app"></main>
</div>

<script>
(function(){
'use strict';
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const hash=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h};
const list=a=>a.length<3?a.join(' and '):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
const plural=(n,w)=>n+' '+w+(n===1?'':'s');

function load(){
  try{
    const r=localStorage.getItem(KEY);if(!r)return false;
    const d=JSON.parse(r);
    if(!d||!Array.isArray(d.guys)||!d.guys.length||!Array.isArray(d.prompts)||!d.prompts.length)return false;
    if(!d.guys.every(g=>g&&g.id&&g.real&&g.look&&typeof g.name==='string'))return false;
    S.bride=typeof d.bride==='string'?d.bride:'';S.guys=d.guys;S.prompts=d.prompts.filter(p=>p&&typeof p.text==='string');

/* ---------- names, looks ---------- */
function nameFor(real,seed){
  const key=real.trim().split(/\s+/)[0].toLowerCase().replace(/[^a-z]/g,'');
  if(seed===0&&FLIP[key])return FLIP[key];
  const pool=BYLETTER[key[0]]||ALLNAMES;
  return pool[(hash(key)+seed)%pool.length];
}
function pickUnused(pool,taken,current){
  const free=pool.filter(x=>!taken.has(x)&&x!==current);
  return pick(free.length?free:pool);
}
function randLook(){return {hair:rnd(6),face:rnd(5),glasses:pick([0,0,1,2])}}
function takenSets(excludeId){
  const t={names:new Set(),titles:new Set(),bios:new Set()};
  S.guys.forEach(g=>{if(g.id===excludeId)return;t.names.add(g.name.toLowerCase());t.titles.add(g.title);t.bios.add(g.bio)});
  return t;
}
function seededFree(pool,taken,seed){
  const i=hash(seed)%pool.length;
  for(let k=0;k<pool.length;k++){const v=pool[(i+k)%pool.length];if(!taken.has(v))return v}
  return pool[i];
}
function newGuy(real,t){
  let seed=0,name=nameFor(real,seed),n=0;
  while(t.names.has(name.toLowerCase())&&n<40){seed++;name=nameFor(real,seed);n++}
  const h=hash(real.trim().toLowerCase());
  const title=TITLE_OV[real.trim().toLowerCase()]||seededFree(TITLES,t.titles,real+'|t'),bio=seededFree(BIOS,t.bios,real+'|b');
  t.names.add(name.toLowerCase());t.titles.add(title);t.bios.add(bio);
  return {id:'g_'+h.toString(36),real,nameSeed:seed,name,title,bio,look:{hair:h%6,face:(h>>>3)%5,glasses:[0,0,1,2][(h>>>6)%4]}};
}
function reshuffle(g){
  const t=takenSets(g.id);
  let seed=g.nameSeed+1,name=nameFor(g.real,seed),n=0;
  while((t.names.has(name.toLowerCase())||name===g.name)&&n<40){seed++;name=nameFor(g.real,seed);n++}
  g.nameSeed=seed;g.name=name;g.title=pickUnused(TITLES,t.titles,g.title);g.bio=pickUnused(BIOS,t.bios,g.bio);
}
function rebuildRoster(names){
  const old=new Map(S.guys.map(g=>[g.real.toLowerCase(),g]));
  const seen=new Set(),slots=[];
  names.forEach(n=>{const k=n.toLowerCase();if(seen.has(k)||slots.length>=16)return;seen.add(k);slots.push({real:n,guy:old.get(k)||null})});
  const t={names:new Set(),titles:new Set(),bios:new Set()};
  slots.forEach(s=>{if(s.guy){t.names.add(s.guy.name.toLowerCase());t.titles.add(s.guy.title);t.bios.add(s.guy.bio)}});
  S.guys=slots.map(s=>s.guy||newGuy(s.real,t));
}

const photoKey=g=>String(g.ph!=null?g.ph:(g.real||'')).trim().split(/\s+/)[0].toLowerCase();
const hasPhoto=g=>!!PHOTOS[photoKey(g)];
function av(g){const u=PHOTOS[photoKey(g)];return u?'<img class="pimg" src="'+u+'" alt="'+esc(g.name)+'">':avatarSVG(g.look)}
const tint=i=>'--t:var(--t'+(i%6)+')';

/* ---------- helpers ---------- */
const bride=()=>S.bride.trim()||'The bride';
const guyById=id=>S.guys.find(g=>g.id===id);
const idxOf=id=>S.guys.findIndex(g=>g.id===id);
function wins(){
  const w={};S.guys.forEach(g=>w[g.id]=0);
  (S.game?S.game.results:[]).forEach(r=>r.winners.forEach(id=>{if(id in w)w[id]++}));
  return w;
}
function toTop(){try{window.scrollTo({top:0,behavior:'auto'})}catch(e){}}
function emptyBlock(title,text,view,label){
  return `<section class="panel center"><h2>${esc(title)}</h2><p class="hint" style="margin-inline:auto">${esc(text)}</p><div class="actions"><button class="btn primary" data-view="${view}">${esc(label||'Go to the roster')}</button></div></section>`;
}

/* ---------- tiles ---------- */
function tile(x,i,o){
  const badges=(o.bride||o.win)?`<span class="badges">${o.bride?'<span class="badge">Bride</span>':''}${o.win?'<span class="badge gold">'+(o.tie?'Tie':'Winner')+'</span>':''}</span>`:'';
  const face=`<span class="face${hasPhoto(x)?' ph':''}">${av(x)}</span>`;
  const info=`<span class="info"><span class="nm">${esc(x.name)}</span><span class="tt">${esc(x.title)}</span>`;
  const st=tint(i);
  if(o.kind==='pick')return `<button type="button" class="tile${o.sel?' sel':''}" style="${st}" data-act="${o.act}" data-id="${x.id}" aria-pressed="${o.sel?'true':'false'}">${badges}${face}${info}</span></button>`;
  if(o.kind==='vote')return `<div class="tile" style="${st}">${face}${info}<span class="stepper"><button type="button" data-act="dec" data-id="${x.id}" aria-label="Remove a vote for ${esc(x.name)}">−</button><output>${o.votes||0}</output><button type="button" data-act="inc" data-id="${x.id}" aria-label="Add a vote for ${esc(x.name)}">+</button></span></span></div>`;
  return `<div class="tile${o.win?' win':''}" style="${st}">${badges}${face}${info}</span>${o.line?`<span class="votes">${o.line}</span>`:''}</div>`;
}

function newDeck(){return shuffle(S.guys.map(x=>x.id))}
function modeToggle(){
  const m=S.pickMode;
  return `<div class="seg" role="group" aria-label="How to view the guys"><button type="button" data-act="mode" data-mode="cards" aria-pressed="${m==='cards'}">Cards</button><button type="button" data-act="mode" data-mode="list" aria-pressed="${m==='list'}">List</button></div>`;
}
function deckHTML(d,di){
  const x=guyById(d[di]);if(!x)return '';
  const nx=d.length>1?guyById(d[(di+1)%d.length]):null;
  const card=(y,cls)=>`<div class="swipe-card ${cls}" style="${tint(idxOf(y.id))}"${cls==='top'?` data-id="${y.id}"`:''}><div class="art">${av(y)}</div><div class="cap"><span class="nm">${esc(y.name)}</span><span class="tt">${esc(y.title)}</span></div></div>`;
  return `<div class="deckmeta"><span>Guy ${di+1} of ${d.length}</span></div><div class="deck">${nx?card(nx,'back'):''}${card(x,'top')}</div><div class="swrow"><button type="button" class="round" data-act="swipe" data-dir="1" aria-label="Previous guy">\u2039</button><button type="button" class="btn primary pickbtn" data-act="choose" data-id="${x.id}">Pick ${esc(x.name)}</button><button type="button" class="round" data-act="swipe" data-dir="-1" aria-label="Next guy">\u203A</button></div><p class="swhint">Swipe or use the arrows to browse, then pick one.</p>`;
}
/* ---------- views ---------- */
function guyCard(g,i){
  return `<article class="guy" style="${tint(i)}">
    <div class="guy-top"><div class="avatar">${av(g)}</div><div class="who"><span class="num">#${String(i+1).padStart(2,'0')}</span><span class="was">was ${esc(g.real)}</span></div></div>
    <div class="guy-body">
      <label for="n-${g.id}">Name</label><input type="text" id="n-${g.id}" data-f="name" data-id="${g.id}" value="${esc(g.name)}" autocomplete="off">
      <label for="t-${g.id}">Title</label><input type="text" id="t-${g.id}" data-f="title" data-id="${g.id}" value="${esc(g.title)}" autocomplete="off">
      <label for="b-${g.id}">Bio</label><textarea id="b-${g.id}" data-f="bio" data-id="${g.id}" rows="3">${esc(g.bio)}</textarea>
      <div class="actions tight"><button type="button" class="btn small" data-act="reshuffle" data-id="${g.id}">Reshuffle</button>${hasPhoto(g)?'':'<button type="button" class="btn small" data-act="newlook" data-id="${g.id}">New look</button>'}</div>
    </div>
  </article>`;
}
function vRoster(){
  const text=S.draft!=null?S.draft:S.guys.map(g=>g.real).join('\n');
  const on=S.prompts.filter(p=>p.on).length;
  return `<section class="panel">
    <div class="ph"><h2>Your crew</h2>${S.example?'<span class="tag">Example guests</span>':''}</div>
    <p class="hint">${S.example?'Swap these names for your real guest list, one per line, then press the button. ':''}Each guest becomes a guy with a new name, a job title and a look. Edits here only save in this browser.</p>
    <label for="bride">Bride</label><input type="text" id="bride" value="${esc(S.bride)}" autocomplete="off">
    <label for="guests">Guests, one per line</label><textarea id="guests" rows="6">${esc(text)}</textarea>
    <div class="actions"><button type="button" class="btn primary" data-act="make">Turn them into guys</button></div>
  </section>
  <section class="sect"><h2>The guys (${S.guys.length})</h2>
    <p class="hint" style="margin:-6px 0 16px">Edit anything. Rewrite each bio to fit the real friend, since the bride has to guess who it is.</p>
    <div class="cards">${S.guys.map(guyCard).join('')}</div>
  </section>
  <section class="panel sect">
    <h2>Ready to play</h2>
    <p class="hint">${S.guys.length} guys, ${plural(on,'prompt')} switched on.</p>
    <details class="pl" id="prompt-details"${S.promptsOpen?' open':''}>
      <summary>Prompts</summary>
      <ul class="plist">${S.prompts.map((p,i)=>`<li><label for="p-${i}"><input type="checkbox" id="p-${i}" data-act="toggle-prompt" data-i="${i}"${p.on?' checked':''}><span><span class="pre">Most likely to </span>${esc(p.text)}</span></label><button type="button" class="btn small ghost" data-act="rm-prompt" data-i="${i}" aria-label="Remove prompt ${i+1}">Remove</button></li>`).join('')}</ul>
      <div class="addrow"><input type="text" id="newPrompt" placeholder="Most likely to..." aria-label="New prompt" autocomplete="off"><button type="button" class="btn small" data-act="add-prompt">Add</button></div>
    </details>
    ${S.notice?`<p class="notice" role="alert">${esc(S.notice)}</p>`:''}
    <div class="actions"><button type="button" class="btn primary" data-act="start"${S.guys.length<2?' disabled':''}>Start the game</button></div>
    ${S.guys.length<2?'<p class="hint">Add at least two guests to start.</p>':''}
  </section>`;
}

function vPlay(){
  if(S.guys.length<2)return emptyBlock('Add at least two guests','The game needs a few guys to choose from.','roster');
  if(!S.game){
    return `<section class="panel center"><h2>Ready when you are</h2><p class="hint" style="margin-inline:auto">${S.guys.length} guys, ${S.prompts.filter(p=>p.on).length} prompts. ${esc(bride())} picks, the room votes, and a miss costs a sip.</p><div class="actions"><button type="button" class="btn primary" data-act="start">Start round 1</button></div></section>`;
  }
  const g=S.game,total=g.order.length,played=g.results.length,hits=g.results.filter(r=>r.match).length;
  const head=`<div class="rh"><span>${g.i<total?'Round '+(g.i+1)+' of '+total:'All rounds played'}</span><span>${hits} of ${played} matched</span></div><div class="prog" role="progressbar" aria-label="Rounds finished" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${Math.min(g.i,total)}"><i style="width:${total?Math.min(100,g.i/total*100):0}%"></i></div>`;
  if(g.i>=total){
    return head+`<section class="panel center sect"><h2>That was the last prompt</h2><p class="hint" style="margin-inline:auto">${esc(bride())} matched the room ${plural(hits,'time')} out of ${played}.</p><div class="actions"><button type="button" class="btn primary" data-view="results">See results</button></div></section>`;
  }
  const card=`<div class="prompt"><p class="k">Most likely to</p><h2>${esc(g.order[g.i])}</h2></div>`;
  let body='';
  if(g.phase==='pick'){
    body=S.pickMode==='list'
      ?`<p class="instr"><strong>${esc(bride())}</strong>, tap the guy who fits, then lock it in.</p>`+modeToggle()+`<div class="tiles">${S.guys.map((x,i)=>tile(x,i,{kind:'pick',act:'pick',sel:g.pick===x.id})).join('')}</div><div class="actions"><button type="button" class="btn primary" data-act="lock"${g.pick?'':' disabled'}>Lock it in</button><button type="button" class="btn small ghost" data-act="skip">Skip this prompt</button></div>`
      :`<p class="instr"><strong>${esc(bride())}</strong>, look through the guys and pick the one who fits.</p>`+modeToggle()+deckHTML(g.deck,g.di)+`<div class="actions" style="justify-content:center"><button type="button" class="btn small ghost" data-act="skip">Skip this prompt</button></div>`;
  }else if(g.phase==='vote'){
    const sum=S.guys.reduce((a,x)=>a+(g.votes[x.id]||0),0);
    body=`<p class="instr">Check each guest's phone. Tap + for every vote a guy got.</p>
      <div class="tiles">${S.guys.map((x,i)=>tile(x,i,{kind:'vote',votes:g.votes[x.id]||0})).join('')}</div>
      <div class="actions"><button type="button" class="btn primary" data-act="reveal"${sum?'':' disabled'}>Reveal</button><button type="button" class="btn small" data-act="back">Change her pick</button></div>`;
  }else{
    const r=g.results[g.results.length-1],wn=r.winners.map(guyById).filter(Boolean),pk=guyById(r.pick),top=r.votes[r.winners[0]]||0;
    const headline=wn.length>1?'Tie between '+list(wn.map(x=>x.name)):wn[0].name+' takes it';
    const verdict=r.match?`<strong>${esc(bride())} matched the room.</strong> No drink.`:`<strong>${esc(bride())} picked ${esc(pk?pk.name:'someone else')}.</strong> Take a sip or do the dare: ${esc(r.dare)}`;
    body=`<div class="tiles">${S.guys.map((x,i)=>tile(x,i,{kind:'reveal',win:r.winners.includes(x.id),tie:wn.length>1,bride:r.pick===x.id,line:plural(r.votes[x.id]||0,'vote')})).join('')}</div>
      <div class="verdict ${r.match?'hit':'miss'}" aria-live="polite"><h3>${esc(headline)}</h3><p>${plural(top,'vote')}. ${verdict}</p></div>
      <div class="actions"><button type="button" class="btn primary" data-act="next">${g.i===total-1?'Finish rounds':'Next prompt'}</button></div>`;
  }
  return head+card+body;
}

function vBonus(){
  if(S.guys.length<2)return emptyBlock('Add at least two guests','The bonus round needs a few guys to choose from.','roster');
  if(!S.bonus)S.bonus={order:shuffle(S.guys.map(g=>g.id)),i:0,pick:null,revealed:false,results:[],deck:newDeck(),di:0,pass:0};
  const b=S.bonus;
  while(b.i<b.order.length&&!guyById(b.order[b.i]))b.i++;
  const total=b.order.length,hits=b.results.filter(r=>r.hit).length;
  const head=`<div class="rh"><span>${b.i<total?'Bio '+(b.i+1)+' of '+total:'Bonus round done'}</span><span>${hits} of ${b.results.length} guessed</span></div><div class="prog" role="progressbar" aria-label="Bios finished" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${Math.min(b.i,total)}"><i style="width:${total?Math.min(100,b.i/total*100):0}%"></i></div>`;
  if(b.i>=total){
    return head+`<section class="panel center sect"><h2>Bonus round complete</h2><p class="hint" style="margin-inline:auto">${esc(bride())} named ${hits} of ${b.results.length} guys from their bios.</p><div class="actions"><button type="button" class="btn primary" data-view="results">See results</button><button type="button" class="btn" data-act="replay-bonus">Play it again</button><button type="button" class="btn primary" data-view="reveal">Reveal who's who</button></div></section>`;
  }
  const t=guyById(b.order[b.i]);
  const card=`<div class="prompt alt"><p class="k">Who is this guy?</p><h2>“${esc(t.bio||'No bio. Suspicious.')}”</h2></div>`;
  let body='';
  if(!b.revealed){
    body=S.pickMode==='list'
      ?`<p class="instr">Read it out loud, then <strong>${esc(bride())}</strong> taps the guy it describes.</p>`+modeToggle()+`<div class="tiles">${S.guys.map((x,i)=>tile(x,i,{kind:'pick',act:'bpick',sel:b.pick===x.id})).join('')}</div><div class="actions"><button type="button" class="btn primary" data-act="breveal"${b.pick?'':' disabled'}>Lock it in and reveal</button></div>`
      :`<p class="instr">Read it out loud, then <strong>${esc(bride())}</strong> looks through the guys and picks the one it describes.</p>`+modeToggle()+deckHTML(b.deck,b.di);
  }else{
    const r=b.results[b.results.length-1],pk=guyById(r.pick);
    body=`<div class="tiles">${S.guys.map((x,i)=>tile(x,i,{kind:'reveal',win:x.id===t.id,bride:r.pick===x.id})).join('')}</div>
      <div class="verdict ${r.hit?'hit':'miss'}" aria-live="polite"><h3>${r.hit?'Correct':'Not quite'}</h3><p>That was <strong>${esc(t.name)}</strong>.${r.hit?' No drink.':' '+esc(bride())+' picked '+esc(pk?pk.name:'someone else')+'. Take a sip.'}</p></div>
      <div class="actions"><button type="button" class="btn primary" data-act="bnext">${b.i===total-1?'Finish bonus round':'Next bio'}</button></div>`;
  }
  return head+card+body;
}

function resultsText(w,played,hits){
  const rows=S.guys.slice().sort((a,b)=>w[b.id]-w[a.id]).map((g,i)=>(i+1)+'. '+g.name+': '+plural(w[g.id],'win'));
  const out=['Most Likely Bros','',...rows];
  if(played)out.push('',bride()+' matched the room '+hits+' of '+played+' times.');
  const b=S.bonus;if(b&&b.results.length)out.push('Bonus round: '+b.results.filter(r=>r.hit).length+' of '+b.results.length+' bios guessed.');
  return out.join('\n');
}
function vResults(){
  const g=S.game,played=g?g.results.length:0,b=S.bonus,br=b?b.results:[];
  if(!played&&!br.length)return `<section class="panel center"><h2>No scores yet</h2><p class="hint" style="margin-inline:auto">Play a few rounds and the standings show up here.</p><div class="actions"><button type="button" class="btn primary" data-act="goto-play">Go to the game</button></div></section>`;
  const w=wins(),max=Math.max(0,...Object.values(w)),hits=played?g.results.filter(r=>r.match).length:0;
  const winners=S.guys.filter(x=>w[x.id]===max);
  const hero=played&&max>0?`<section class="hero"><div class="hero-av">${winners.slice(0,3).map(x=>`<span style="${tint(idxOf(x.id))}">${av(x)}</span>`).join('')}</div><div><p class="k">${winners.length>1?'Bros of the night':'Bro of the night'}</p><h2>${esc(list(winners.map(x=>x.name)))}</h2><p>${plural(max,'round')} won.</p></div></section>`:'';
  const stats=`<div class="stats">${played?`<div class="stat"><span class="big">${hits}<small> of ${played}</small></span><span class="lab">${esc(bride())} matched the room</span></div>`:''}${br.length?`<div class="stat"><span class="big">${br.filter(r=>r.hit).length}<small> of ${br.length}</small></span><span class="lab">Bios guessed in the bonus round</span></div>`:''}</div>`;
  const rows=S.guys.map((x,i)=>({x,i})).sort((a,c)=>w[c.x.id]-w[a.x.id]||a.i-c.i);
  const standings=played?`<section class="sect"><h2>Standings</h2><div class="standings">${rows.map((r,k)=>`<div class="srow" style="${tint(r.i)}"><span class="rk">${k+1}</span><span class="mini">${av(r.x)}</span><div><div class="nm">${esc(r.x.name)}</div><div class="bar"><i style="--w:${max?w[r.x.id]/max*100:0}%"></i></div></div><span class="ct">${w[r.x.id]}</span></div>`).join('')}</div></section>`:'';
  const copy=S.copyText?`<label for="copybox">Select all and copy</label><textarea id="copybox" readonly rows="6">${esc(S.copyText)}</textarea>`:'';
  return hero+stats+standings+`<div class="actions">${g&&g.i>=g.order.length?'<button type="button" class="btn'+(br.length?' primary':'')+'" data-view="reveal">Reveal who\'s who</button>':''}<button type="button" class="btn" data-act="copy">Copy results</button><button type="button" class="btn primary" data-act="again">Play again</button>${isHost()?'<button type="button" class="btn small ghost" data-view="roster">Edit roster</button>':''}</div>`+copy;
}

function vReveal(){
  if(S.guys.length<2)return emptyBlock('Add at least two guests','Nothing to reveal yet.','roster');
  const fl=S.flipped,done=S.guys.every(g=>fl.includes(g.id));
  const cards=S.guys.map((g,i)=>{
    const on=fl.includes(g.id),rp=REAL_PHOTOS[photoKey(g)];
    const back=rp?`<span class="art ph"><img class="pimg" src="${rp}" alt="${esc(g.real)}"></span>`:`<span class="art${hasPhoto(g)?' ph':''}">${av(g)}</span>`;
    return `<button type="button" class="flip${on?' on':''}" style="${tint(i)}" data-act="flip" data-id="${g.id}" aria-pressed="${on}" aria-label="${esc(g.name)}${on?', really '+esc(g.real):''}"><span class="fi"><span class="ff"><span class="art${hasPhoto(g)?' ph':''}">${av(g)}</span><span class="cap"><span class="nm">${esc(g.name)}</span><span class="tt">${esc(g.title)}</span></span></span><span class="fb">${back}<span class="real">${esc(g.real)}</span><span class="was2">was ${esc(g.name)}</span></span></span></button>`;
  }).join('');
  return `<section class="panel center"><p class="eyebrow">The big reveal</p><h2>Who's who</h2><p class="hint" style="margin-inline:auto">Tap a guy to see who he really is.</p><div class="actions">${done?'<button type="button" class="btn" data-act="unflip">Hide all</button>':'<button type="button" class="btn primary" data-act="flipall">Reveal all</button>'}<button type="button" class="btn small ghost" data-view="results">Back to results</button></div></section><div class="flips">${cards}</div>${done?'<div class="actions" style="justify-content:center"><button type="button" class="btn primary" data-act="again">Play again</button></div>':''}`;
}
function renderNav(){
  const tabs=[['play','Play'],['results','Results']];
  if(isHost())tabs.unshift(['roster','Roster']);
  $('#nav').innerHTML=tabs.map(t=>`<button type="button" data-view="${t[0]}"${(S.view===t[0]||(t[0]==='play'&&S.view==='bonus'))?' aria-current="page"':''}>${t[1]}</button>`).join('');
}
function render(){
  if(isGuest()){renderGuest();return}
  if(S.view==='roster'&&!isHost())S.view='play';
  if((S.view==='bonus'||S.view==='reveal')&&!(S.game&&S.game.i>=S.game.order.length))S.view='play';
  renderNav();
  $('#app').innerHTML=({roster:vRoster,play:vPlay,bonus:vBonus,results:vResults,reveal:vReveal})[S.view]();
}

/* ---------- game flow ---------- */
function startGame(){
  let order=S.prompts.filter(p=>p.on).map(p=>p.text);
  if(!order.length){S.notice='Switch on at least one prompt first.';S.view='roster';S.promptsOpen=true;render();return}
  S.notice='';S.game={gid:uid(),order,i:0,phase:'pick',pick:null,votes:{},results:[],deck:newDeck(),di:0,pass:0};S.bonus=null;S.copyText=null;S.flipped=[];S.view='play';render();toTop();
}
function revealRound(){
  const g=S.game,max=Math.max(...S.guys.map(x=>g.votes[x.id]||0));
  const winners=S.guys.filter(x=>(g.votes[x.id]||0)===max).map(x=>x.id);
  const match=winners.includes(g.pick),w1=guyById(winners[0]);
  const dare=match?null:pick(DARES).replace('{guy}',w1.name).replace('{real}',w1.real);
  g.results.push({pick:g.pick,winners,match,dare,votes:Object.assign({},g.votes)});
  g.phase='reveal';
}
function nextRound(){const g=S.game;g.i++;g.phase='pick';g.pick=null;g.votes={};g.deck=newDeck();g.di=0;g.pass=0}
function copyResults(btn){
  const w=wins(),g=S.game,played=g?g.results.length:0,hits=played?g.results.filter(r=>r.match).length:0;
  const txt=resultsText(w,played,hits);
  const fallback=()=>{S.copyText=txt;render();const t=$('#copybox');if(t){t.focus();t.select()}};
  try{
    navigator.clipboard.writeText(txt).then(()=>{btn.textContent='Copied';setTimeout(()=>{btn.textContent='Copy results'},1600)},fallback);
  }catch(e){fallback()}
}

/* ---------- events ---------- */
const app=document.getElementById('app'),navEl=document.getElementById('nav');
navEl.addEventListener('click',e=>{
  const b=e.target.closest('[data-view]');if(!b)return;
  S.view=b.dataset.view;S.notice='';S.copyText=null;render();toTop();
});
app.addEventListener('click',e=>{
  const v=e.target.closest('[data-view]');
  if(v){S.view=v.dataset.view;S.notice='';S.copyText=null;render();toTop();return}
  const el=e.target.closest('[data-act]');if(!el||el.tagName==='INPUT')return;
  const act=el.dataset.act,id=el.dataset.id,g=S.game,b=S.bonus;
  switch(act){
    case 'make':{
      const names=($('#guests').value||'').split(/[\n,]+/).map(s=>s.trim()).filter(Boolean);
      if(!names.length){S.notice='Add at least one guest name.';render();return}
      const before=S.guys.map(x=>x.real.toLowerCase()).join('|');
      rebuildRoster(names);
      const after=S.guys.map(x=>x.real.toLowerCase()).join('|');
      S.example=false;
      S.draft=null;S.notice='';
      if(before!==after){S.game=null;S.bonus=null}
      save();render();break;
    }
    case 'reshuffle':{const x=guyById(id);if(x){reshuffle(x);save();render()}break}
    case 'newlook':{const x=guyById(id);if(x){x.look=randLook();save();render()}break}
    case 'rm-prompt':{S.prompts.splice(+el.dataset.i,1);save();render();break}
    case 'add-prompt':addPrompt();break;
    case 'start':startGame();break;
    case 'goto-play':if(S.game){S.view='play';render();toTop()}else startGame();break;
    case 'pick':if(g){g.pick=id;render()}break;
    case 'lock':if(g&&g.pick){g.phase='vote';render()}break;
    case 'back':if(g){g.phase='pick';g.deck=newDeck();g.di=0;g.pass=0;render()}break;
    case 'inc':if(g){g.votes[id]=Math.min(99,(g.votes[id]||0)+1);render()}break;
    case 'dec':if(g){g.votes[id]=Math.max(0,(g.votes[id]||0)-1);render()}break;
    case 'reveal':if(g){revealRound();render()}break;
    case 'next':if(g){nextRound();render();toTop()}break;
    case 'skip':if(g){nextRound();render();toTop()}break;
    case 'bpick':if(b){b.pick=id;render()}break;
    case 'breveal':if(b&&b.pick){const t=b.order[b.i];b.results.push({id:t,pick:b.pick,hit:b.pick===t});b.revealed=true;render()}break;
    case 'bnext':if(b){b.i++;b.pick=null;b.revealed=false;b.deck=newDeck();b.di=0;b.pass=0;render();toTop()}break;
    case 'replay-bonus':S.bonus=null;render();toTop();break;
    case 'choose':{
      if(S.view==='play'&&g&&g.phase==='pick'){g.pick=id;g.phase='vote';render()}
      else if(S.view==='bonus'&&b&&!b.revealed){b.pick=id;b.results.push({id:b.order[b.i],pick:id,hit:id===b.order[b.i]});b.revealed=true;render()}
      break}
    case 'mode':S.pickMode=el.dataset.mode==='list'?'list':'cards';render();break;
    case 'swipe':{const c=$('.swipe-card.top');if(c)fly(c,+el.dataset.dir);break}
    case 'gstart':GS.step='q';GS.i=0;GS.picks={};GS.edit=false;gsave();render();toTop();break;
    case 'gsum':GS.step='sum';gsave();render();toTop();break;
    case 'gpick':{const t=gPrompts()[GS.i];if(t){GS.picks[t]=id;gsave();render()}break}
    case 'gnext':{if(GS.i>=gPrompts().length-1)GS.step='sum';else GS.i++;gsave();render();toTop();break}
    case 'gback':{if(GS.i>0)GS.i--;else GS.step='intro';gsave();render();toTop();break}
    case 'gedit':GS.step='q';GS.i=+el.dataset.i;GS.edit=true;gsave();render();toTop();break;
    case 'gdone':GS.step='sum';GS.edit=false;gsave();render();toTop();break;
    case 'gagain':GS.step='intro';GS.i=0;GS.picks={};GS.edit=false;gsave();render();toTop();break;
    case 'flip':{const k=S.flipped.indexOf(id);if(k<0)S.flipped.push(id);else S.flipped.splice(k,1);render();break}
    case 'flipall':S.flipped=S.guys.map(x=>x.id);render();break;
    case 'unflip':S.flipped=[];render();break;
    case 'copy':copyResults(el);break;
    case 'again':startGame();break;
  }
});
function addPrompt(){
  const inp=$('#newPrompt');if(!inp)return;
  const t=inp.value.trim().replace(/^most\s+likely\s+to\s*/i,'');
  if(!t)return;
  S.prompts.push({text:t,on:true});S.promptsOpen=true;save();render();
  const n=$('#newPrompt');if(n)n.focus();
}
app.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.f){const x=guyById(t.dataset.id);if(x){x[t.dataset.f]=t.value;save()}return}
  if(t.id==='bride'){S.bride=t.value;save();return}
  if(t.id==='gname'){GS.name=t.value;gsave();return}
  if(t.id==='guests'){S.draft=t.value}
});
app.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.act==='toggle-prompt'){const p=S.prompts[+t.dataset.i];if(p){p.on=t.checked;save();render()}}
  if(t.dataset.act==='toggle-shuffle'){S.shuffle=t.checked;save()}
});
app.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='newPrompt'){e.preventDefault();addPrompt()}
});
app.addEventListener('toggle',e=>{if(e.target.id==='prompt-details')S.promptsOpen=e.target.open},true);

function commit(dir){
  const t=(S.view==='play'&&S.game&&S.game.phase==='pick')?S.game:(S.view==='bonus'&&S.bonus&&!S.bonus.revealed)?S.bonus:null;
  if(!t)return;
  const n=t.deck.length;
  t.di=(t.di+(dir<0?1:-1)+n)%n;
  render();
}
function fly(card,dir){
  if(card.dataset.busy)return;card.dataset.busy='1';
  const id=card.dataset.id;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){commit(dir);return}
  card.style.transition='transform .3s ease-in,opacity .3s';
  card.style.transform='translate('+(dir*window.innerWidth)+'px,-30px) rotate('+(dir*24)+'deg)';
  card.style.opacity='0';
  setTimeout(()=>commit(dir),280);
}
let drag=null;
app.addEventListener('pointerdown',e=>{
  const c=e.target.closest('.swipe-card.top');if(!c||c.dataset.busy)return;
  drag={c,x:e.clientX,y:e.clientY,dx:0,t:Date.now()};
  try{c.setPointerCapture(e.pointerId)}catch(err){}
  c.style.transition='none';
});
app.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.dx=dx;
  drag.c.style.transform='translate('+dx+'px,'+(dy*0.25)+'px) rotate('+(dx/18)+'deg)';
  const y=drag.c.querySelector('.stamp.yes'),n=drag.c.querySelector('.stamp.no');
  if(y)y.style.opacity=Math.min(1,Math.max(0,dx/90));
  if(n)n.style.opacity=Math.min(1,Math.max(0,-dx/90));
});
function endDrag(){
  if(!drag)return;
  const {c,dx,t}=drag;drag=null;
  const speed=Math.abs(dx)/Math.max(1,Date.now()-t);
  if(Math.abs(dx)>90||(Math.abs(dx)>40&&speed>0.6)){fly(c,dx>0?1:-1)}
  else{
    c.style.transition='transform .2s';c.style.transform='';
    c.querySelectorAll('.stamp').forEach(x=>x.style.opacity=0);
  }
}
app.addEventListener('pointerup',endDrag);
app.addEventListener('pointercancel',endDrag);
document.addEventListener('keydown',e=>{
  if(e.target&&e.target.matches&&e.target.matches('input,textarea,select'))return;
  if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;
  const c=$('.swipe-card.top');
  if(c&&!c.dataset.busy){e.preventDefault();fly(c,e.key==='ArrowRight'?-1:1)}
});

/* ---------- guest view ---------- */
const GK='most-likely-bros-guest-v1';
const GS={step:'intro',i:0,name:'',picks:{},edit:false};
try{const d=JSON.parse(localStorage.getItem(GK)||'null');if(d&&typeof d==='object'){GS.step=(d.step==='q'||d.step==='sum')?d.step:'intro';GS.i=+d.i||0;GS.name=typeof d.name==='string'?d.name:'';GS.picks=(d.picks&&typeof d.picks==='object')?d.picks:{}}}catch(e){}
function gsave(){try{localStorage.setItem(GK,JSON.stringify(GS))}catch(e){}}
const gPrompts=()=>S.prompts.filter(p=>p.on).map(p=>p.text);
function vGuest(){
  const ps=gPrompts(),br=S.bride.trim()||'the bride';
  if(S.guys.length<2||!ps.length)return `<section class="panel center"><h2>Nothing to vote on yet</h2></section>`;
  if(GS.step==='intro'){
    return `<section class="panel"><h2>Make your picks</h2><p class="hint">Go through each prompt and tap the guy you think fits best. When you finish, show your phone to ${esc(br)}.</p>
      <label for="gname">Your name</label><input type="text" id="gname" value="${esc(GS.name)}" autocomplete="off">
      <div class="actions"><button type="button" class="btn primary" data-act="gstart">${Object.keys(GS.picks).length?'Start again':'Start'}</button>${Object.keys(GS.picks).length?'<button type="button" class="btn" data-act="gsum">See my picks</button>':''}</div></section>`;
  }
  if(GS.step==='q'){
    const i=Math.min(Math.max(GS.i,0),ps.length-1),t=ps[i],sel=GS.picks[t];
    const head=`<div class="rh"><span>Prompt ${i+1} of ${ps.length}</span><span>${Object.keys(GS.picks).filter(k=>ps.includes(k)).length} picked</span></div><div class="prog" role="progressbar" aria-label="Prompts finished" aria-valuemin="0" aria-valuemax="${ps.length}" aria-valuenow="${i}"><i style="width:${i/ps.length*100}%"></i></div>`;
    const card=`<div class="prompt"><p class="k">Most likely to</p><h2>${esc(t)}</h2></div>`;
    const next=GS.edit?'<button type="button" class="btn primary" data-act="gdone"'+(sel?'':' disabled')+'>Done</button>':'<button type="button" class="btn primary" data-act="gnext"'+(sel?'':' disabled')+'>'+(i===ps.length-1?'Finish':'Next')+'</button>';
    return head+card+`<p class="instr">Tap the guy who fits best.</p><div class="tiles">${S.guys.map((x,k)=>tile(x,k,{kind:'pick',act:'gpick',sel:sel===x.id})).join('')}</div><div class="actions">${GS.edit?'':'<button type="button" class="btn" data-act="gback">Back</button>'}${next}</div>`;
  }
  const rows=ps.map((t,i)=>{
    const g=guyById(GS.picks[t]);
    return `<div class="grow"${g?` style="${tint(idxOf(g.id))}"`:''}><span class="gn">${i+1}</span><div class="gq"><span class="k">Most likely to</span><strong>${esc(t)}</strong></div>${g?`<div class="gp"><span class="gimg">${av(g)}</span><span class="gnm">${esc(g.name)}</span></div>`:'<div class="gp"><span class="gnm">No pick</span></div>'}<button type="button" class="btn small" data-act="gedit" data-i="${i}">Change</button></div>`;
  }).join('');
  return `<section class="panel"><p class="eyebrow">Picks from</p><h2>${esc(GS.name.trim()||'A guest')}</h2><p class="hint">Show this screen to ${esc(br)}.</p></section><div class="glist">${rows}</div><div class="actions"><button type="button" class="btn small ghost" data-act="gagain">Start over</button></div>`;
}
function renderGuest(){
  $('#nav').innerHTML='';
  const l=$('.lede');if(l)l.textContent='Pick the guy you think fits each prompt, then show your phone to '+(S.bride.trim()||'the bride')+'.';
  $('#app').innerHTML=vGuest();
}
window.addEventListener('hashchange',()=>{if(!isHost()&&S.view==='roster')S.view='play';render()});
/* ---------- boot ---------- */
if(!load()){
  S.prompts=DEFAULT_PROMPTS.map(t=>({text:t,on:true}));
  rebuildRoster(EXAMPLE);S.example=false;
}
S.seed2=true;S.guys=S.guys.filter(g=>g.real.trim().toLowerCase()!=='alyna');
if(!S.seed3){S.seed3=true;const M={nina:['Nino','Nick'],bernita:['Bernard','Ben'],gini:['Gene','Greg'],anna:['Anton','Anthony']};S.guys.forEach(g=>{const m=M[g.real.trim().toLowerCase()];if(m&&g.name===m[0])g.name=m[1]})}
if((S.pv||0)<1){S.pv=1;["catch the bouquet", "still be dancing when the DJ stops"].forEach(t=>{if(!S.prompts.some(p=>p.text===t))S.prompts.push({text:t,on:true})})}
if(S.tv<5){S.tv=5;S.seed9=true;S.seed8=true;S.seed7=true;S.guys.forEach(g=>{const t=TITLE_OV[g.real.trim().toLowerCase()];if(t)g.title=t})}
if(!S.seed6){S.seed6=true;const DROP=["be late to the wedding", "lose their phone", "ruin the group photo", "pull an all-nighter and be fine", "know everyone's business", "still be talking about this weekend in ten years"];S.prompts=S.prompts.filter(p=>!DROP.includes(p.text))}
if(!S.seed5){S.seed5=true;const M5={alyna:['Mark','Alan'],katie:['Dan','Kit'],bernita:['Tom','Ben'],gini:['Rob','Greg'],jennifer:['Steve','Jeff'],nina:['Paul','Nick'],sherry:['Chad','Sherman'],suzy:['Vince','Stu'],terry:['Luke','Terrence'],anna:['Wes','Anthony']};S.guys.forEach(g=>{const m=M5[g.real.trim().toLowerCase()];if(m&&g.name===m[0])g.name=m[1]})}
save();render();
})();
</script>
